spring.application.name=HelpDesk_SaaS

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk_saas
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiry-ms=${JWT_EXPIRY}
jwt.refresh-expiration-ms=${REFRESH_TOKEN_EXPIRY}
spring.data.redis.host=localhost
spring.data.redis.port=6379


# Gmail notification
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true